ata-i18n="changelogs.0003.fad5dfe7" value=""></option></select><div class="changeCount" data-i18n="changelogs.0004.aebec3b5" id="changeCount"></div></div><div class="changelogList" id="changelogList"></div></div></section></main><footer class="footer"><div class="shell footerRow"><div><b data-i18n="common.0043.6fbe3f50"></b><br/><span data-i18n="common.0050.b002c49f"></span></div></div></footer><script src="data/wiki-data.js"></script><script src="assets/pokelog-icons.js"></script><script src="assets/app.js"></script><script src="assets/i18n.js"></script><script>(async()=>{const r=document.querySelector('#changelogList'),q=document.querySelector('#changeSearch'),sel=document.querySelector('#changeType'),count=document.querySelector('#changeCount'),e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));try{const d=await(await fetch('data/changelogs.json',{cache:'no-store'})).json();const cats=[...new Set(d.flatMap(x=>x.secciones.map(s=>s.titulo)))].sort((a,b)=>a.localeCompare(b,'es'));sel.innerHTML+=[...cats].map(x=>`<option value="${e(x)}">${e(x)}</option>`).join('');function draw(){const term=q.value.trim().toLowerCase(),type=sel.value;let total=0;const days=d.map((x,idx)=>{const secs=x.secciones.map(s=>({...s,cambios:s.cambios.filter(c=>(!term||(`${x.fecha} ${s.titulo} ${c}`).toLowerCase().includes(term)))})).filter(s=>(!type||s.titulo===type)&&s.cambios.length);if(!secs.length)return '';total+=secs.reduce((n,s)=>n+s.cambios.length,0);return `<article class="changeDay"><div class="changeHead"><span>${idx?'Actualización':'Más reciente'}</span><h2>${e(x.fecha)}</h2></div>${secs.map(s=>`<section class="changeSection"><h3>${e(s.titulo)}</h3><ul>${s.cambios.map(c=>`<li>${e(c)}</li>`).join('')}</ul></section>`).join('')}</article>`}).join('');r.innerHTML=days||'<div class="changeEmpty">No encontramos cambios con esos filtros.</div>';count.textContent=`${total.toLocaleString('es-MX')} cambios`;}q.addEventListener('input',draw);sel.addEventListener('change',draw);draw()}catch(err){r.innerHTML='<div class="notice"><b>No se pudieron cargar los changelogs.</b> Verifica que el sitio se esté ejecutando desde un servidor web.</div>';console.error(err)}})();</script><script src="assets/enhancements.js"></script></body></html>
