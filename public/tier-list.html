(()=>{const rows=(window.PKA_DATA?.tierList||[]).map(x=>({name:String(x['Pokémon']||'').trim(),tier:String(x['Tier']||'').trim(),type:String(x['Moveset']||'').trim()})).filter(x=>x.name);const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const N=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const order=['T1','T2','T3','T4','T5','T6','T7','Super Rare','Ultra Rare','Legendary','Mythic'];const uniq=a=>[...new Set(a.filter(x=>x&&x!=='?'))];const q=document.querySelector('#tierSearch'),tf=document.querySelector('#tierClassFilter'),yf=document.querySelector('#tierTypeFilter'),vf=document.querySelector('#tierVariantFilter'),pp=document.querySelector('#tierPerPage'),tb=document.querySelector('#tierRows');let page=1;uniq(rows.map(x=>x.tier)).sort((a,b)=>{let ai=order.indexOf(a),bi=order.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi)||a.localeCompare(b,'es')}).forEach(x=>tf.add(new Option(x,x)));uniq(rows.map(x=>x.type)).sort((a,b)=>a.localeCompare(b,'es')).forEach(x=>yf.add(new Option(x,x)));function filtered(){return rows.filter(x=>(!q.value||N(x.name).includes(N(q.value)))&&(!tf.value||x.tier===tf.value)&&(!yf.value||x.type===yf.value)&&(!vf.value||(vf.value==='shiny'?/^Shiny /i.test(x.name):!/^Shiny /i.test(x.name))))}function draw(){const data=filtered(),per=+pp.value||25,pages=Math.max(1,Math.ceil(data.length/per));if(page>pages)page=pages;const view=data.slice((page-1)*per,page*per);document.querySelector('#tierCount').textContent=data.length.toLocaleString('es-MX')+' Pokémon';document.querySelector('#tierPageInfo').textContent='Página '+page+' de '+pages;document.querySelector('#tierEmpty').hidden=!!view.length;tb.innerHTML=view.map(x=>{const src=typeof pokemonSprite==='function'?pokemonSprite(x.name):'';return `<tr><td data-label="Pokémon"><a class="tierPokeCell" href="pokemon.html?name=${encodeURIComponent(x.name)}">${src?`<img src="${E(src)}" alt="${E(x.name)}" loading="lazy" onerror="this.style.display='none'">`:''}<strong>${E(x.name)}</strong></a></td><td data-label="Clasificación"><span class="tierClassBadge">${E(x.tier||'—')}</span></td><td data-label="Moveset / Tipo">${typeof typeBadge==='function'&&x.type?typeBadge(N(x.type)):E(x.type||'—')}</td></tr>`}).join('');document.querySelector('#tierPrev').disabled=page<=1;document.querySelector('#tierNext').disabled=page>=pages;const box=document.querySelector('#tierPages');let nums=[];for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)nums.push(i);box.innerHTML=nums.map(i=>`<button class="${i===page?'active':''}" data-page="${i}">${i}</button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;draw();scrollTo({top:220,behavior:'smooth'})})}q.oninput=()=>{page=1;draw()};[tf,yf,vf,pp].forEach(x=>x.onchange=()=>{page=1;draw()});document.querySelector('#tierClear').onclick=()=>{q.value='';tf.value=yf.value=vf.value='';pp.value='25';page=1;draw()};document.querySelector('#tierPrev').onclick=()=>{if(page>1){page--;draw();scrollTo({top:220,behavior:'smooth'})}};document.querySelector('#tierNext').onclick=()=>{page++;draw();scrollTo({top:220,behavior:'smooth'})};draw()})();
