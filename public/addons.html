<span data-i18n="common.0064.950a39b6"></span><html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="Outfits y addons de Pokémon en PokeAlliance: apariencia, Pokémon compatible y cómo conseguirlos." name="description"/><title data-i18n="addons.0001.d7df796d"></title><link href="assets/styles.css" rel="stylesheet"/><meta content="#071625" name="theme-color"/><link href="assets/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/><link href="assets/apple-touch-icon.png" rel="apple-touch-icon"/><link href="manifest.webmanifest" rel="manifest"/><style>

){.addonGrid{grid-template-columns:1fr}.addonVisual{height:215px}}
</style></head><body data-page="addons"><header class="topbar"><div class="shell nav"><a class="brand" href="index.html"><span class="brandmark"><img alt="" aria-hidden="true" src="assets/pka-wiki-logo.png"/></span><span data-i18n="common.0043.6fbe3f50"></span></a><nav class="navlinks"><a data-i18n="common.0029.4f70d8c3" href="index.html"></a><a data-i18n="common.0044.cc6fda44" href="pokedex.html"></a><a data-i18n="common.0032.519707b8" href="localizaciones.html"></a><a data-i18n="common.0024.0017eb27" href="guias.html"></a><a data-i18n="common.0055.efd933bd" href="sistemas.html"></a></nav><button aria-label="Abrir menú" class="menuBtn">☰</button></div></header><main><section class="pageHead"><div class="shell"><span class="eyebrow" data-i18n="addons.0002.69491c5c"></span><h1 data-i18n="addons.0003.73d831c5"></h1><p class="addonIntro" data-i18n="addons.0004.88c4ace8"></p><div class="quickLinks"><a data-i18n="common.0044.cc6fda44" href="pokedex.html"></a><a data-i18n="common.0035.7041bfe3" href="megastones.html"></a><a data-i18n="common.0009.f32c2dbc" href="addons.html"></a></div></div></section><section class="section"><div class="shell"><div class="notice"><span data-i18n="addons.0005.1dc90c37"></span> <b>No Shiny</b><span data-i18n="addons.0006.c223d169"></span> <b data-i18n="addons.0007.cdea279b"></b> <span data-i18n="addons.0008.af643819"></span></div><div class="addonToolbar"><input id="addonSearch" placeholder="Buscar Pokémon o addon…" type="search"/><select id="addonPokemon"><option value="all">Todos los Pokémon</option></select><select id="addonOrigin"><option data-i18n="addons.0009.09455520" value="all"></option><option value="Tienda de Diamantes">Tienda de Diamantes</option><option data-i18n="addons.0010.ee9e0895" value="Pase de Batalla"></option><option value="Twitch">Tienda de Twitch</option><option value="Market">Market</option></select><select id="addonVariant"><option value="all">Shiny y No Shiny</option><option value="shiny">Shiny</option><option value="normal">No Shiny</option></select></div><p class="addonCount" data-i18n="addons.0011.646fe381" id="addonCount"></p><div class="addonGrid" id="addonGrid"></div><p class="sourceNote" data-i18n="addons.0012.cc09fb84"></p></div></section></main><footer class="footer"><div class="shell footerRow"><div><b data-i18n="common.0043.6fbe3f50"></b><br/><span data-i18n="common.0050.b002c49f"></span></div><div data-i18n="addons.0013.059eba87"></div></div></footer><script src="assets/app.js"></script><script src="assets/i18n.js"></script><script>
const escAddon=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let addons=[];const grid=document.getElementById('addonGrid'),count=document.getElementById('addonCount'),q=document.getElementById('addonSearch'),pokemon=document.getElementById('addonPokemon'),origin=document.getElementById('addonOrigin'),variant=document.getElementById('addonVariant');
function drawAddons(){const text=q.value.trim().toLowerCase();const rows=addons.filter(x=>(!text||`${x.pokemon} ${x.costume}`.toLowerCase().includes(text))&&(pokemon.value==='all'||x.pokemon===pokemon.value)&&(origin.value==='all'||x.origin===origin.value)&&(variant.value==='all'||(variant.value==='shiny'?x.shiny:!x.shiny)));count.textContent=`${rows.length} de ${addons.length} addons`;grid.innerHTML=rows.length?rows.map(x=>`<article class="addonCard"><div class="addonVisual"><img src="${escAddon(x.image)}" alt="${escAddon(x.costume)} de ${x.shiny?'Shiny ':''}${escAddon(x.pokemon)}" loading="lazy"></div><h3>${escAddon(x.costume)}</h3><div class="addonPokemon">${x.shiny?'Shiny ':''}${escAddon(x.pokemon)}</div><p class="addonHow"><b>Cómo se consigue:</b> ${escAddon(x.origin)} · ${escAddon(x.cost)}</p><div class="addonMeta"><span class="addonTag ${x.shiny?'shiny':'normal'}">${x.shiny?'Shiny':'No Shiny'}</span><span class="addonTag">${escAddon(x.origin)}</span></div></article>`).join(''):'<div class="addonEmpty">No hay addons que coincidan con los filtros.</div>'}
[q,pokemon,origin,variant].forEach(el=>el.addEventListener(el===q?'input':'change',drawAddons));fetch('data/addons.json').then(r=>r.json()).then(x=>{addons=x;const names=[...new Set(addons.map(a=>a.pokemon))].sort((a,b)=>a.localeCompare(b,'es'));pokemon.insertAdjacentHTML('beforeend',names.map(n=>`<option value="${escAddon(n)}">${escAddon(n)}</option>`).join(''));drawAddons()}).catch(()=>{count.textContent='No se pudo cargar la información';grid.innerHTML='<div class="addonEmpty">No fue posible cargar los addons.</div>'});
</script></body></html>
