(()=>{const data=[{"name":"Machamp","coord":"287, 3399, 8","zone":"wildscape","available":12,"accessTitle":"Cómo llegar a la instancia de Machamp","steps":[{"title":"1. Parte desde Shamouti Island","text":"Desde Shamouti Island, dirígete hacia el norte siguiendo la costa y continúa hacia el oeste por el mar hasta llegar a la isla de Machamp. Sigue la ruta marcada en la imagen como referencia.","image":"machamp-ruta-shamouti.png"},{"title":"2. Localiza la escalera de acceso","text":"Una vez en la isla, dirígete hacia la parte superior de la zona. La entrada se encuentra un nivel por encima del nivel del mar. Busca la escalera señalada en la imagen y sube por ella para continuar hacia la instancia.","image":"machamp-escalera.png"}]},{"name":"Hitmonlee","coord":"303, 3426, 6","zone":"wildscape","available":12,"accessTitle":"Cómo llegar a la instancia de Hitmonlee","steps":[{"title":"1. Sigue la ruta desde Shamouti Island","text":"Desde Shamouti Island, sigue la ruta marcada por el mar hasta llegar a la isla donde se encuentran los accesos de Hitmonlee y Hitmonchan.","image":"hitmonlee-hitmonchan-ruta-shamouti.png"},{"title":"2. Sube las escaleras y entra al pasillo","text":"Al llegar a la isla, sube por las escaleras. En el pasillo de la parte superior se encuentran las dos entradas, una para Hitmonlee y otra para Hitmonchan. Dirígete a la entrada de Hitmonlee mostrada en la imagen.","image":"hitmonlee.png"}]},{"name":"Hitmonchan","coord":"285, 3447, 6","zone":"wildscape","available":12,"accessTitle":"Cómo llegar a la instancia de Hitmonchan","steps":[{"title":"1. Sigue la ruta desde Shamouti Island","text":"Desde Shamouti Island, sigue la ruta marcada por el mar hasta llegar a la isla donde se encuentran los accesos de Hitmonlee y Hitmonchan.","image":"hitmonlee-hitmonchan-ruta-shamouti.png"},{"title":"2. Sube las escaleras y entra al pasillo","text":"Al llegar a la isla, sube por las escaleras. En el pasillo de la parte superior se encuentran las dos entradas, una pa ajando por las escaleras hasta llegar a la entrada del Hunt Primal. La entrada está en 1407, 4496, 7 y el área cuenta con 3 zonas de respawn.","image":"mightyena-entrada.png"},{"title":"Coordenadas de la entrada","text":"Coordenadas: 1407, 4496, 7.","image":"mightyena-coordenadas.png"}]},{"name":"Absol","coord":"2257, 3994, 7","zone":"primal","available":"1 zona","hunt":true,"huntLabel":"Hunt Primal · 1 zona de respawn","accessTitle":"Cómo llegar al Hunt Primal de Absol","steps":[{"title":"1. Vuela siguiendo la ruta","text":"Desde Lilycove City, vuela siguiendo la ruta marcada hacia el oeste. Mantente en la zona más alta mientras avanzas hasta llegar al final del recorrido.","image":"absol-ruta.png"},{"title":"2. Llega a la zona de acceso","text":"Al final de la ruta encontrarás esta zona. Es el punto de referencia antes de bajar hacia la entrada.","image":"absol-zona.png"},{"title":"3. Primera opción para bajar","text":"Puedes bajar sin problema en la zona mostrada y después dirigirte hacia los escalones.","image":"absol-bajada.png"},{"title":"4. Segunda opción y entrada","text":"También puedes bajar directamente por esta zona. La escalera mostrada es la entrada al Hunt Primal de Absol, que cuenta con 1 zona de respawn.","image":"absol-entrada.png"},{"title":"Coordenadas de la entrada","text":"Coordenadas: 2257, 3994, 7.","image":"absol-coordenadas.png"}]},{"name":"Rampardos","coord":"2397, 4190, 7","zone":"primal","available":3,"level":"350+","revives":false,"accessTitle":"Instancia Primal de Rampardos","steps":[{"title":"1. Ubicación de la instancia","text":"Dirígete a las coordenadas 2397, 4190, 7, en la zona mostrada al suroeste de Lilycove City.","image":"rampardos-mapa.png"},{"title":"2. Entra a la instancia Primal","text":"Interactúa con la Entrada de Instancia y selecciona una de las 3 instancias disponibles. Requisito: nivel 350+. No se pueden utilizar Revives dentro de esta instancia.","image":"rampardos-instancia.png"}]},{"name":"Espeon","coord":"1305, 1515, 7","zone":"wildscape","available":12,"accessTitle":"Cómo entrar a la instancia de Espeon","steps":[{"title":"1. Ve a la Isla de los Eevee","text":"La Isla de los Eevee se encuentra al norte de Olivine. Busca las escaleras de acceso señaladas en la imagen.","image":"espeon-entrada.png"},{"title":"2. Localiza la entrada de la instancia","text":"Después de bajar, avanza hasta la entrada de la instancia de Espeon. La imagen muestra el punto de acceso dentro de la zona.","image":"espeon-instancia.png"},{"title":"3. Selecciona una instancia","text":"Interactúa con la entrada y selecciona una de las instancias disponibles para entrar.","image":"espeon-acceso.png"}]},{"name":"Umbreon","coord":"1114, 1534, 7","zone":"wildscape","available":12,"accessTitle":"Cómo entrar a la instancia de Umbreon","steps":[{"title":"1. Ve a la Isla de los Eevee","text":"Al igual que Espeon, el acceso se encuentra en la Isla de los Eevee, al norte de Olivine. Busca la entrada mostrada en la imagen.","image":"umbreon-acceso.png"},{"title":"2. Localiza la entrada de Umbreon","text":"Continúa por la zona hasta llegar al punto mostrado en el mapa. Ahí se encuentra la entrada de la instancia de Umbreon.","image":"umbreon-entrada.png"},{"title":"3. Selecciona una instancia","text":"Interactúa con la entrada y selecciona una de las instancias disponibles para entrar.","image":"umbreon-instancia.png"}]},{"name":"Hydreigon","coord":"4287, 1993, 7","zone":"wildscape","available":12,"accessTitle":"Cómo entrar a la instancia de Hydreigon","steps":[{"title":"1. Ve a la Isla de los Gastly","text":"La Isla de los Gastly está al noreste de Cerulean. En la isla encontrarás unas escaleras por las que debes bajar.","image":"hydreigon-isla.png"},{"title":"2. Baja por las escaleras","text":"Usa las escaleras de la isla para entrar a la zona subterránea. Esta imagen muestra el punto exacto y el minimapa.","image":"hydreigon-escaleras.png"},{"title":"3. Usa una Mythic Ground Orb en la tumba","text":"Ve a la habitación redonda de abajo a la derecha y dirígete a la última tumba del lado derecho. Coloca una Mythic Ground Orb en la tierra y camina hacia la tumba para desbloquear el acceso. Nota: para regresar debes utilizar esa misma tumba desde el cementerio.","image":"hydreigon-tumba.png"},{"title":"4. Cruza el cementerio hacia el noreste","text":"Serás transportado a un cementerio. Avanza hacia el noreste. En esta zona aparecen Gengar, Misdreavus, Tyranitar y Hydreigon salvajes.","image":"hydreigon-cementerio.png"},{"title":"5. Llega a la entrada de Hydreigon","text":"Continúa hacia el noreste hasta encontrar la entrada de la instancia de Hydreigon.","image":"hydreigon-entrada.png"},{"title":"6. Selecciona una instancia","text":"Interactúa con la entrada y selecciona una de las 9 instancias disponibles.","image":"hydreigon-instancia.png"}]}];const rows=document.querySelector('#instanceRows'),search=document.querySelector('#instanceSearch'),filter=document.querySelector('#zoneFilter'),empty=document.querySelector('#emptyState'),count=document.querySelector('#instanceCount'),modal=document.querySelector('#instanceModal'),mTitle=document.querySelector('#modalTitle'),mMeta=document.querySelector('#modalMeta'),steps=document.querySelector('#modalSteps'),close=document.querySelector('#closeModal');const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();function sprite(n){if(window.PKA_POKELOG_ICONS&&window.PKA_POKELOG_ICONS[n])return window.PKA_POKELOG_ICONS[n];return 'https://play.pokemonshowdown.com/sprites/gen5/'+norm(n).replace(/[.’']/g,'').replace(/[^a-z0-9-]/g,'')+'.png'}function zlabel(z){return z==='normal'?'Normal':z==='primal'?'Primal':'Wildscape'}function show(x){const pt=document.documentElement.lang==='pt-BR';mTitle.textContent=(pt&&x.accessTitlePt?x.accessTitlePt:x.accessTitle)||(x.images&&x.images.length>1?'Cómo llegar a '+x.name:'Entrada de '+x.name);mMeta.textContent=(x.hunt?'Coordenadas de la entrada: ':'Coordenadas de la instancia: ')+x.coord+' · '+zlabel(x.zone)+(x.huntLabel?' · '+x.huntLabel:(x.hunt?' · Hunt':'') )+(x.level?' · Nivel '+x.level:'')+(x.revives===false?' · Sin Revives':'');if(x.steps){steps.innerHTML=x.steps.map(st=>`<div class="modalStep"><b>${pt&&st.titlePt?st.titlePt:st.title}</b><p>${pt&&st.textPt?st.textPt:st.text}</p><img class="modalImage" src="assets/instances/${st.image}" alt="${st.title} - ${x.name}" loading="lazy" decoding="async"></div>`).join('')}else{steps.innerHTML=x.images.map((img,i)=>`<div class="modalStep">${x.images.length>1?`<b>${i===0?'1. Entra por este portal':'2. Una vez dentro, ve hasta esta ubicación'}</b>`:''}<img class="modalImage" src="assets/instances/${img}" alt="Mapa de acceso de ${x.name}" loading="lazy" decoding="async"></div>`).join('')}modal.classList.add('open');close.focus()}function render(){const q=norm(search.value),z=filter.value;const list=data.filter(x=>(!q||norm(x.name).includes(q))&&(z==='all'||x.zone===z));const row=x=>`<tr><td><div class="pokeCell"><img class="pokeSprite" loading="lazy" src="${sprite(x.name)}" alt="${x.name}" onerror="this.style.visibility='hidden'" decoding="async"><span>${x.name}</span></div></td><td class="coord">${x.coord}</td><td><span class="zoneBadge ${x.zone}">${x.zone==='normal'?'● Normal':x.zone==='primal'?'◆ Primal':'◆ Wildscape'}</span></td><td>${typeof x.available==='number'?x.available:`<span class="unavailable">${x.available}</span>`}</td><td><button type="button" class="viewBtn" data-i="${data.indexOf(x)}">Ver entrada</button></td></tr>`;const alpha=(a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'});const groups=[['normal','Instancias normales'],['wildscape','Instancias Wildscape'],['primal','Instancias Primal']];rows.innerHTML=groups.map(([zone,label])=>{const group=list.filter(x=>x.zone===zone).sort(alpha);return group.length?`<tr class="instanceGroupRow"><td colspan="5">${label} <span>${group.length}</span></td></tr>${group.map(row).join('')}`:''}).join('');empty.style.display=list.length?'none':'block';count.textContent=list.length===1?'1 ubicación encontrada':`${list.length} ubicaciones encontradas`;rows.querySelectorAll('.viewBtn').forEach(b=>b.addEventListener('click',()=>show(data[+b.dataset.i])))}function hide(){modal.classList.remove('open');steps.innerHTML=''}const cloneBtn=document.querySelector('#cloneRouteBtn');if(cloneBtn)cloneBtn.addEventListener('click',()=>{mTitle.textContent='Cómo llegar a los respawns de Clones';mMeta.textContent='Clones · 20 instancias simultáneas';steps.innerHTML=`<div class="modalStep"><b>Ruta desde Mandarin Island</b><p>Desde Mandarin Island, habla con los Vikings para ir a Mewtwo Island. La imagen marca el punto de referencia y la ruta de acceso.</p><img class="modalImage" src="assets/guides/mewtwo-mandarin-island.png" alt="Ruta desde Mandarin Island hacia Mewtwo Island para llegar a los respawns de Clones" loading="lazy" decoding="async"></div>`;modal.classList.add('open');close.focus()});search.addEventListener('input',render);filter.addEventListener('change',render);close.addEventListener('click',hide);modal.addEventListener('click',e=>{if(e.target===modal)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))hide()});render()})();
</script>
<script>
(()=>{
  let overlay,stage,img,scale=1,x=0,y=0,startX=0,startY=0,startPX=0,startPY=0,dragging=false;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const apply=()=>{img.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`};
  const fit=()=>{
    if(!img.naturalWidth||!img.naturalHeight)return;
    const pad=36,w=window.innerWidth-pad*2,h=window.innerHeight-pad*2;
    scale=Math.min(1,w/img.naturalWidth,h/img.naturalHeight);x=0;y=0;apply();
  };
  const zoom=(factor)=>{scale=clamp(scale*factor,.15,6);apply()};
  function build(){
    overlay=document.createElement('div'); overlay.className='imageZoomOverlay'; overlay.setAttribute('aria-hidden','true');
    overlay.innerHTML=`<div class="imageZoomStage"><img class="imageZoomImg" alt=""></div><div class="imageZoomControls"><button class="imageZoomBtn" type="button" data-action="out" aria-label="Alejar">−</button><button class="imageZoomBtn" type="button" data-action="reset" aria-label="Restablecer tamaño">↺</button><button class="imageZoomBtn" type="button" data-action="in" aria-label="Acercar">+</button><button class="imageZoomBtn" type="button" data-action="close" aria-label="Cerrar">×</button></div><div class="imageZoomHint">Clic en +/− o rueda del ratón para ampliar · Arrastra para mover</div>`;
    document.body.appendChild(overlay); stage=overlay.querySelector('.imageZoomStage'); img=overlay.querySelector('.imageZoomImg');
    overlay.querySelector('[data-action="in"]').addEventListener('click',()=>zoom(1.25));
    overlay.querySelector('[data-action="out"]').addEventListener('click',()=>zoom(.8));
    overlay.querySelector('[data-action="reset"]').addEventListener('click',fit);
    overlay.querySelector('[data-action="close"]').addEventListener('click',closeZoom);
    stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87)},{passive:false});
    stage.addEventListener('pointerdown',e=>{dragging=true;startPX=e.clientX;startPY=e.clientY;startX=x;startY=y;stage.classList.add('dragging');stage.setPointerCapture(e.pointerId)});
    stage.addEventListener('pointermove',e=>{if(!dragging)return;x=startX+(e.clientX-startPX);y=startY+(e.clientY-startPY);apply()});
    stage.addEventListener('pointerup',e=>{dragging=false;stage.classList.remove('dragging');try{stage.releasePointerCapture(e.pointerId)}catch(_){}});
    stage.addEventListener('pointercancel',()=>{dragging=false;stage.classList.remove('dragging')});
    window.addEventListener('resize',()=>{if(overlay.classList.contains('open'))fit()});
  }
  function openZoom(src,alt){if(!overlay)build();img.onload=fit;img.src=src;img.alt=alt||'';overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';if(img.complete)fit()}
  function closeZoom(){if(!overlay)return;overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';img.removeAttribute('src')}
  document.addEventListener('click',e=>{const target=e.target.closest('.modalImage');if(!target)return;e.preventDefault();e.stopPropagation();openZoom(target.currentSrc||target.src,target.alt)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay&&overlay.classList.contains('open')){e.stopPropagation();closeZoom()}});
})();
</script>
