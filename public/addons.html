const escAddon=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let addons=[];const grid=document.getElementById('addonGrid'),count=document.getElementById('addonCount'),q=document.getElementById('addonSearch'),pokemon=document.getElementById('addonPokemon'),origin=document.getElementById('addonOrigin'),variant=document.getElementById('addonVariant');
function drawAddons(){const text=q.value.trim().toLowerCase();const rows=addons.filter(x=>(!text||`${x.pokemon} ${x.costume}`.toLowerCase().includes(text))&&(pokemon.value==='all'||x.pokemon===pokemon.value)&&(origin.value==='all'||x.origin===origin.value)&&(variant.value==='all'||(variant.value==='shiny'?x.shiny:!x.shiny)));count.textContent=`${rows.length} de ${addons.length} addons`;grid.innerHTML=rows.length?rows.map(x=>`<article class="addonCard"><div class="addonVisual"><img src="${escAddon(x.image)}" alt="${escAddon(x.costume)} de ${x.shiny?'Shiny ':''}${escAddon(x.pokemon)}" loading="lazy" decoding="async"></div><h3>${escAddon(x.costume)}</h3><div class="addonPokemon">${x.shiny?'Shiny ':''}${escAddon(x.pokemon)}</div><p class="addonHow"><b>Cómo se consigue:</b> ${escAddon(x.origin)} · ${escAddon(x.cost)}</p><div class="addonMeta"><span class="addonTag ${x.shiny?'shiny':'normal'}">${x.shiny?'Shiny':'No Shiny'}</span><span class="addonTag">${escAddon(x.origin)}</span></div></article>`).join(''):'<div class="addonEmpty">No hay addons que coincidan con los filtros.</div>'}
[q,pokemon,origin,variant].forEach(el=>el.addEventListener(el===q?'input':'change',drawAddons));fetch('data/addons.json').then(r=>r.json()).then(x=>{addons=x;const names=[...new Set(addons.map(a=>a.pokemon))].sort((a,b)=>a.localeCompare(b,'es'));pokemon.insertAdjacentHTML('beforeend',names.map(n=>`<option value="${escAddon(n)}">${escAddon(n)}</option>`).join(''));drawAddons()}).catch(()=>{count.textContent='No se pudo cargar la información';grid.innerHTML='<div class="addonEmpty">No fue posible cargar los addons.</div>'});
