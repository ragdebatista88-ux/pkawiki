<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changelogs | PKA No Oficial Wiki</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="topbar"><div class="shell nav"><a class="brand" href="index.html"><span class="brandmark">PKA</span><span>PKA No Oficial Wiki</span></a><nav class="navlinks"><a href="index.html">Inicio</a><a href="pokedex.html">Pokédex</a><a href="localizaciones.html">Localizaciones</a><a href="tasks.html">Tasks</a><a href="dungeons.html">Dungeons</a><a href="guias.html">Guías</a><a href="sistemas.html">Sistemas</a><a href="changelogs.html">Changelogs</a><a href="faq.html">FAQ</a></nav><button class="menuBtn" aria-label="Abrir menú">☰</button></div></header><main><section class="pageHead"><div class="shell"><span class="eyebrow">Actualizaciones</span><h1>Changelogs</h1><p>Cambios organizados del más reciente al más antiguo y adaptados al español.</p></div></section><section class="section"><div class="shell guide"><div id="changelogList" class="changelogList"></div></div></section></main><footer class="footer"><div class="shell footerRow"><div><b>PKA No Oficial Wiki</b><br>Proyecto comunitario no afiliado ni respaldado oficialmente por PokeAlliance.</div></div></footer><script src="data/wiki-data.js"></script><script src="assets/app.js"></script><script>(async()=>{const r=document.querySelector('#changelogList'),e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));try{const d=await(await fetch('data/changelogs.json',{cache:'no-store'})).json();r.innerHTML=d.map((x,i)=>`<article class="changeDay"><div class="changeHead"><span>${i?'Actualización':'Más reciente'}</span><h2>${e(x.fecha)}</h2></div>${x.secciones.map(s=>`<section class="changeSection"><h3>${e(s.titulo)}</h3><ul>${s.cambios.map(c=>`<li>${e(c)}</li>`).join('')}</ul></section>`).join('')}</article>`).join('')}catch(err){r.innerHTML='<div class="notice"><b>No se pudieron cargar los changelogs.</b> Verifica que el sitio se esté ejecutando desde un servidor web.</div>';console.error(err)}})();</script></body></html>
