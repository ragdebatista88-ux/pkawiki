ef57e7"></th><th>Ubicación</th><th>Referencia</th></tr></thead><tbody id="npcRows"></tbody></table><div class="tierEmpty" data-i18n="npcs.0009.d47bd32a" hidden="" id="npcEmpty"></div><div class="tierPagination"><button data-i18n="npcs.0010.87b0f809" id="npcPrev"></button><div class="tierPageButtons" id="npcPages"></div><button data-i18n="npcs.0011.c6e084bf" id="npcNext"></button></div></div><div class="npcSourceNote" data-i18n="npcs.0012.158c177e"></div></div></section></main><footer class="footer"><div class="shell footerRow"><div><b data-i18n="common.0043.6fbe3f50"></b><br/><span data-i18n="common.0050.b002c49f"></span></div><div data-i18n="npcs.0013.7c60c491"></div></div></footer><script src="data/pokemon-index.js"></script><script src="assets/pokelog-icons.js"></script><script src="assets/app.js"></script><script src="assets/i18n.js"></script><script>
(async()=>{const data=await(await fetch('data/npcs.json',{cache:'force-cache'})).json();const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const N=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const q=document.querySelector('#npcSearch'),cf=document.querySelector('#npcCategory'),im=document.querySelector('#npcImageFilter'),pp=document.querySelector('#npcPerPage'),tb=document.querySelector('#npcRows');let page=1;[...new Set(data.map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')).forEach(x=>cf.add(new Option(x,x)));function filtered(){return data.filter(x=>(!q.value||N([x.nombre,x.queHace,x.ubicacion,x.categoria].join(' ')).includes(N(q.value)))&&(!cf.value||x.categoria===cf.value)&&(!im.value||(im.value==='yes'?!!x.imagen:!x.imagen)))}function draw(){const a=filtered(),per=+pp.value||25,pages=Math.max(1,Math.ceil(a.length/per));if(page>pages)page=pages;const view=a.slice((page-1)*per,page*per);document.querySelector('#npcCount').textContent=a.length.toLocaleString('es-MX')+' NPCs';document.querySelector('#npcPageInfo').textContent='Página '+page+' de '+pages;document.querySelector('#npcEmpty').hidden=!!view.length;tb.innerHTML=view.map(x=>`<tr><td data-label="NPC"><strong>${E(x.nombre)}</strong><span class="npcCategoryBadge">${E(x.categoria||'General')}</span></td><td data-label="Qué hace">${E(x.queHace||'—')}${x.pagina?`<div><a class="npcGuideLink" href="${E(x.pagina)}">Ver guía →</a></div>`:''}</td><td data-label="Ubicación">${E(x.ubicacion||'—')}</td><td data-label="Referencia">${x.imagen?`<a class="npcLocationBtn" href="${E(x.imagen)}" target="_blank" rel="noopener">Ver ubicación ↗</a>`:'<span class="npcNoImage">Sin imagen</span>'}</td></tr>`).join('');document.querySelector('#npcPrev').disabled=page<=1;document.querySelector('#npcNext').disabled=page>=pages;const b=document.querySelector('#npcPages');let nums=[];for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)nums.push(i);b.innerHTML=nums.map(i=>`<button class="${i===page?'active':''}" data-page="${i}">${i}</button>`).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>{page=+x.dataset.page;draw();scrollTo({top:220,behavior:'smooth'})})}q.oninput=()=>{page=1;draw()};[cf,im,pp].forEach(x=>x.onchange=()=>{page=1;draw()});document.querySelector('#npcClear').onclick=()=>{q.value=cf.value=im.value='';pp.value='25';page=1;draw()};document.querySelector('#npcPrev').onclick=()=>{if(page>1){page--;draw()}};document.querySelector('#npcNext').onclick=()=>{page++;draw()};draw()})().catch(e=>{console.error(e);document.querySelector('#npcEmpty').hidden=false;document.querySelector('#npcEmpty').textContent='No se pudo cargar el directorio de NPCs.'});
