<script>
(async()=>{
  const D=await(await fetch('data/tasks-table.json',{cache:'no-store'})).json();
  const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const N=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const U=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es'));
  const q=document.querySelector('#taskSearch'),df=document.querySelector('#difficultyFilter'),lf=document.querySelector('#locationFilter'),pf=document.querySelector('#pokemonFilter'),tb=document.querySelector('#taskRows');

  function targets(text){
    const out=[];
    const re=/(\d+)\s+(Shiny\s+)?([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ.'’♀♂-]*)/g;
    let m;
    while((m=re.exec(String(text)))) out.push({qty:m[1],shiny:!!m[2],name:m[3]});
    return out;
  }
  function pokemonTargets(row){
    const parsed=targets(row.task);
    if(parsed.length) return parsed;
    return (Array.isArray(row.pokemon)?row.pokemon:[]).map(name=>({qty:'',shiny:/^Shiny\s+/i.test(name),name:String(name).replace(/^Shiny\s+/i,'')}));
  }
  function targetHtml(row){
    const arr=pokemonTargets(row);
    if(!arr.length) return `<span>${E(row.task)}</span>`;
    const chips=`<div class="taskPokemonList">${arr.map(p=>{
      const full=(p.shiny?'Shiny ':'')+p.name;
      const src=typeof pokemonSprite==='function'?pokemonSprite(full):'';
      const label=(p.qty?p.qty+' ':'')+full;
      return `<span class="taskPokemonChip ${p.shiny?'isShiny':''}" title="${E(label)}">${src?`<img class="taskPokemonSprite" src="${E(src)}" alt="${E(full)}" loading="lazy" onerror="this.style.display='none'">`:''}${p.qty?`<span class="taskPokemonQty">${E(p.qty)}×</span>`:''}<span class="taskPokemonName">${p.shiny?'<b>Shiny</b> ':''}${E(p.name)}</span></span>`;
    }).join('')}</div>`;
    return chips+(targets(row.task).length?'':`<small class="taskPending">Cantidades pendientes de documentar.</small>`);
  }

  document.querySelector('#taskTotal').textContent=D.length+' tasks registradas';
  U(D.map(x=>x.dificultad)).forEach(x=>df.add(new Option(x,x)));
  U(D.map(x=>x.ubicacion)).forEach(x=>lf.add(new Option(x,x)));
  const pokemonNames=U(D.flatMap(x=>pokemonTargets(x).map(p=>p.name)));
  pokemonNames.forEach(x=>pf.add(new Option(x,x)));

  function render(){
    const a=D.filter(x=>(!q.value||N([x.npc,x.ubicacion,x.task,x.recompensa,x.dificultad].join(' ')).includes(N(q.value)))&&(!df.value||x.dificultad===df.value)&&(!lf.value||x.ubicacion===lf.value)&&(!pf.value||pokemonTargets(x).some(p=>N(p.name)===N(pf.value))));
    document.querySelector('#taskCount').textContent=a.length+' '+(a.length===1?'Task':'Tasks');
    document.querySelector('#taskEmpty').hidden=!!a.length;
    tb.innerHTML=a.map(x=>`<tr><td data-label="NPC"><strong>${E(x.npc)}</strong></td><td data-label="Ubicación">${E(x.ubicacion)}</td><td data-label="Qué pide matar" class="taskTarget">${targetHtml(x)}</td><td data-label="Dificultad"><span class="taskDifficulty">${E(x.dificultad)}</span></td><td data-label="Recompensa"><strong>${E(x.recompensa)}</strong>${x.nota?`<small class="taskRewardNote">${E(x.nota)}</small>`:''}</td><td data-label="Ubicación visual">${x.imagen?`<a class="taskMapBtn" href="${E(x.imagen)}" target="_blank" rel="noopener">Ver imagen ↗</a>`:'—'}</td></tr>`).join('');
  }
  [q,df,lf,pf].forEach(e=>e.addEventListener(e===q?'input':'change',render));
  document.querySelector('#clearTaskFilters').onclick=()=>{q.value=df.value=lf.value=pf.value='';render()};
  render();
})().catch(err=>{console.error(err);const e=document.querySelector('#taskEmpty');if(e){e.hidden=false;e.textContent='No se pudieron cargar las Tasks.'}});
</script>
<script src="assets/enhancements.js"></script></body></html>
