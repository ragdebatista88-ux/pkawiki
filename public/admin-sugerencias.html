<section class="pageHead"><div class="shell"><span class="eyebrow">Administración</span><h1 data-i18n="admin-sugerencias.0002.28c430f7"></h1><p data-i18n="admin-sugerencias.0003.c507e0b0"></p></div></section>
<section class="section"><div class="shell">
<div class="adminGate" id="adminLogin"><div class="adminGateIcon">🔐</div><h2 data-i18n="admin-sugerencias.0004.75909fe1"></h2><p data-i18n="admin-sugerencias.0005.c4bac2ff"></p><form id="adminLoginForm"><label><span data-i18n="admin-sugerencias.0006.34937ccd"></span><input autocomplete="current-password" id="adminKey" placeholder="Clave ADMIN_KEY" required="" type="password"/></label><button class="suggestionSubmit" type="submit">Entrar</button></form><div class="suggestionMessage" id="adminLoginMsg" role="status"></div></div>
<div hidden="" id="adminApp">
<div class="adminToolbar"><div class="adminFilters"><select id="statusFilter"><option data-i18n="admin-sugerencias.0007.d8f38266" value=""></option><option value="pendiente">Pendiente</option><option data-i18n="admin-sugerencias.0008.ab356754" value="revision"></option><option value="aceptada">Aceptada</option><option value="implementada">Implementada</option><option value="descartada">Descartada</option></select><input id="adminSearch" placeholder="Buscar en sugerencias…" type="search"/></div><div class="adminToolbarRight"><span class="adminCount" id="adminCount">—</span><button class="adminSecondary" data-i18n="admin-sugerencias.0009.391d6b0b" id="refreshSuggestions" type="button"></button><button class="adminSecondary" id="adminLogout" type="button">Salir</button></div></div>
<div class="suggestionMessage" id="adminNotice" role="status"></div>
<div class="suggestionsList" id="suggestionsList"></div>
</div>
</div></section></main><footer class="footer"><div class="shell footerRow"><div><b data-i18n="common.0043.6fbe3f50"></b><br/><span data-i18n="common.0050.b002c49f"></span></div><div><span data-i18n="common.0016.0ebf698e"></span><br/><span data-i18n="common.0008.1314bebb"></span></div></div></footer><script src="data/pokemon-index.js"></script><script src="assets/pokelog-icons.js"></script><script src="assets/app.js"></script><script src="assets/i18n.js"></script><script src="assets/enhancements.js"></script>
<script>
(()=>{
 const login=document.querySelector('#adminLogin'), app=document.querySelector('#adminApp'), form=document.querySelector('#adminLoginForm'), keyInput=document.querySelector('#adminKey'), loginMsg=document.querySelector('#adminLoginMsg'), list=document.querySelector('#suggestionsList'), count=document.querySelector('#adminCount'), filter=document.querySelector('#statusFilter'), search=document.querySelector('#adminSearch'), notice=document.querySelector('#adminNotice');
 let key=sessionStorage.getItem('pkaAdminKey')||'', rows=[];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const typeLabel={correccion:'Corrección',nueva_guia:'Nueva guía',informacion_faltante:'Información faltante',mejora_wiki:'Mejora de la wiki',otro:'Otro'};
 const statusLabel={pendiente:'Pendiente',revision:'En revisión',aceptada:'Aceptada',implementada:'Implementada',descartada:'Descartada'};
 function setLoginMsg(t,m){loginMsg.className='suggestionMessage '+t;loginMsg.textContent=m;}
 function authHeaders(){return {'Authorization':'Bearer '+key};}
 function formatDate(v){if(!v)return 'Sin fecha';const d=new Date(v.replace(' ','T')+'Z');return isNaN(d)?v:new Intl.DateTimeFormat('es-MX',{dateStyle:'medium',timeStyle:'short'}).format(d);}
 function draw(){
   const q=search.value.trim().toLowerCase(), st=filter.value;
   const view=rows.filter(r=>(!st||r.estado===st)&&(!q||[r.nombre,r.tipo,r.pagina,r.sugerencia,String(r.id)].join(' ').toLowerCase().includes(q)));
   count.textContent=`${view.length} de ${rows.length} sugerencias`;
   list.innerHTML=view.length?view.map(r=>`<article class="suggestionAdminCard" data-id="${r.id}"><div class="suggestionAdminTop"><div><span class="suggestionId">#${r.id}</span><span class="suggestionType">${esc(typeLabel[r.tipo]||r.tipo)}</span></div><time>${esc(formatDate(r.fecha_creacion))}</time></div><h3>${esc(r.pagina||'Sin página relacionada')}</h3><p class="suggestionBody">${esc(r.sugerencia)}</p><div class="suggestionMeta"><span>👤 ${esc(r.nombre||'Anónimo')}</span></div><div class="suggestionAdminFoot"><label>Estado <select class="statusSelect" data-id="${r.id}">${Object.entries(statusLabel).map(([v,l])=>`<option value="${v}" ${r.estado===v?'selected':''}>${l}</option>`).join('')}</select></label></div></article>`).join(''):'<div class="suggestionEmpty">No hay sugerencias que coincidan con los filtros.</div>';
   list.querySelectorAll('.statusSelect').forEach(sel=>sel.addEventListener('change',()=>updateStatus(sel)));
 }
 async function load(){
   notice.className='suggestionMessage';notice.textContent='';list.innerHTML='<div class="suggestionLoading">Cargando sugerencias…</div>';
   const res=await fetch('/api/admin/sugerencias?limit=200',{headers:authHeaders()}); const data=await res.json().catch(()=>({}));
   if(res.status===401){sessionStorage.removeItem('pkaAdminKey');key='';login.hidden=false;app.hidden=true;setLoginMsg('error','La clave no es válida.');return;}
   if(!res.ok) throw new Error(data.error||'No fue posible cargar las sugerencias.');
   rows=data.sugerencias||[]; draw();
 }
 async function updateStatus(sel){
   const id=Number(sel.dataset.id), previous=rows.find(r=>r.id===id)?.estado; sel.disabled=true;
   try{const res=await fetch('/api/admin/sugerencias',{method:'PATCH',headers:{...authHeaders(),'Content-Type':'application/json'},body:JSON.stringify({id,estado:sel.value})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'No se pudo actualizar.');const row=rows.find(r=>r.id===id);if(row)row.estado=sel.value;notice.className='suggestionMessage success';notice.textContent=`Sugerencia #${id} actualizada.`;}
   catch(e){sel.value=previous||'pendiente';notice.className='suggestionMessage error';notice.textContent=e.message;} finally{sel.disabled=false;}
 }
 form.addEventListener('submit',async e=>{e.preventDefault();key=keyInput.value.trim();if(!key)return;sessionStorage.setItem('pkaAdminKey',key);try{await load();if(key){login.hidden=true;app.hidden=false;}}catch(err){setLoginMsg('error',err.message);}});
 document.querySelector('#refreshSuggestions').addEventListener('click',()=>load().catch(e=>{notice.className='suggestionMessage error';notice.textContent=e.message;}));
 document.querySelector('#adminLogout').addEventListener('click',()=>{sessionStorage.removeItem('pkaAdminKey');key='';app.hidden=true;login.hidden=false;keyInput.value='';setLoginMsg('','');});
 filter.addEventListener('change',draw); search.addEventListener('input',draw);
 if(key){login.hidden=true;app.hidden=false;load().catch(e=>{notice.className='suggestionMessage error';notice.textContent=e.message;});}
})();
</script></body></html>
