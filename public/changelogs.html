fecha)}</h2></div>${secs.map(s=>`<section class="changeSection"><h3>${e(s.titulo)}</h3><ul>${s.cambios.map(c=>`<li>${e(c)}</li>`).join('')}</ul></section>`).join('')}</article>`}).join('');r.innerHTML=days||`<div class="changeEmpty">${u.empty}</div>`;count.textContent=`${total.toLocaleString(getLang()==='pt-BR'?'pt-BR':'es-MX')} ${u.changes}`;}async function load(){const lang=getLang(),u=ui();try{d=await(await fetch(`data/changelogs.${lang}.json`,{cache:'force-cache'})).json();const current=sel.value;const cats=[...new Set(d.flatMap(x=>x.secciones.map(s=>s.titulo)))].sort((a,b)=>a.localeCompare(b,lang==='pt-BR'?'pt-BR':'es'));sel.innerHTML=`<option value="">${u.all}</option>`+cats.map(x=>`<option value="${e(x)}">${e(x)}</option>`).join('');if(cats.includes(current))sel.value=current;draw();}catch(err){r.innerHTML=`<div class="notice"><b>${u.error}</b></div>`;console.error(err)}}q.addEventListener('input',draw);sel.addEventListener('change',draw);document.addEventListener('pka:languagechange',load);load();})();</script><script src="assets/enhancements.js"></script></body></html>
