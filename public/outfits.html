<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title data-i18n="outfits.0001.4fe67971"></title><link href="assets/styles.css" rel="stylesheet"/><link data-i18n-preload="common-es" href="lang/es/common.json" rel="preload" as="fetch"/><link data-i18n-preload="page-es" href="lang/es/pages/outfits.json" rel="preload" as="fetch"/><meta content="#071625" name="theme-color"/><link href="assets/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/><link href="assets/apple-touch-icon.png" rel="apple-touch-icon"/><link href="manifest.webmanifest" rel="manifest"/><style>
.outfitIntro{max-width:900px}.outfitToolbar{display:grid;grid-template-columns:minmax(240px,1fr) repeat(2,minmax(170px,220px));gap:10px;margin:18px 0}.outfitToolbar input,.outfitToolbar select{background:#0d1c2f;border:1px solid #274463;color:#fff;border-radius:12px;padding:12px}.outfitCount{color:var(--muted)}.outfitGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;align-items:stretch}.outfitCard{background:linear-gradient(160deg,#12253b,#091827);border:1px solid #1d3855;border-radius:18px;padding:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden;isolation:isolate}.outfitVisual{height:230px;min-height:230px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:13px;background:#0b1b2c;padding:10px;box-sizing:border-box}.outfitVisual img{display:block!important;width:auto!important;height:auto!important;max-width:100%!important;max-height:210px!important;object-fit:contain!important;image-rendering:pixelated;position:static!important;transform:none!important;margin:auto!important;pointer-events:auto!important;cursor:zoom-in}.outfitSwitch{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px;min-height:34px;position:relative;z-index:5}.outfitSwitch button{position:relative;z-index:6;border:1px solid #31516e;background:#10263b;color:#cce0ef;border-radius:999px;padding:7px 11px;cursor:pointer}.outfitSwitch button.on{border-color:#43d9b2;color:#8ff7db}.outfitCard h3{margin:0 0 8px}.outfitHow{font-size:13px;color:#b7c9db;margin:0 0 8px}.outfitHow b{color:#fff}.outfitTags{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.outfitTag{font-size:11px;border:1px solid #294b68;padding:5px 8px;border-radius:999px}.outfitTag.off{border-color:#8b3b48;color:#ff9ca9;background:#361821}.outfitTag.on{border-color:#2d6b58;color:#8ff7db}.outfitNote{font-size:12px;color:#8fa6bb;margin:0 0 10px}.notice{margin-bottom:10px}@media(max-width:900px){.outfitGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.outfitToolbar,.outfitGrid{grid-template-columns:1fr}.outfitVisual{height:230px;min-height:230px}.outfitVisual img{max-height:210px!important}}
.outfitModal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:9999}.outfitModal.open{display:flex}.outfitModalBox{position:relative;max-width:min(92vw,980px);max-height:90vh;background:#081522;border:1px solid #274463;border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.5)}.outfitModalImg{display:block;max-width:86vw;max-height:78vh;object-fit:contain;image-rendering:pixelated}.outfitModalClose{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:999px;border:1px solid #3a5872;background:#0d2033;color:#fff;font-size:22px;cursor:pointer;z-index:2}.outfitModalCaption{margin:10px 44px 0 4px;color:#c8d7e5;font-size:14px}@media(max-width:650px){.outfitModal{padding:12px}.outfitModalBox{padding:12px}.outfitModalImg{max-width:90vw;max-height:72vh}}</style></head><body data-page="outfits"><header class="topbar"><div class="shell nav"><a class="brand" href="index.html"><span class="brandmark"><img alt="" aria-hidden="true" src="assets/pka-wiki-logo.png"/></span><span data-i18n="common.0043.6fbe3f50"></span></a><nav class="navlinks"><a data-i18n="common.0029.4f70d8c3" href="index.html"></a><a data-i18n="common.0044.cc6fda44" href="pokedex.html"></a><a data-i18n="common.0032.519707b8" href="localizaciones.html"></a><a data-i18n="common.0024.0017eb27" href="guias.html"></a><a data-i18n="common.0055.efd933bd" href="sistemas.html"></a></nav><button class="menuBtn">☰</button></div></header><main><section class="pageHead"><div class="shell"><span class="eyebrow" data-i18n="outfits.0002.06b967d6"></span><h1>Outfits</h1><p class="outfitIntro" data-i18n="outfits.0003.4a1cc90f"></p></div></section><section class="section"><div class="shell"><div class="notice"><b data-i18n="outfits.0004.70425e3c"></b> <span data-i18n="outfits.0005.ad4cef6b"></span></div><div class="outfitToolbar"><input id="q" placeholder="Buscar outfit o forma de conseguirlo…" type="search"/><select id="origin"><option data-i18n="outfits.0006.09455520" value="all"></option></select><select id="status"><option data-i18n="outfits.0007.f4334701" value="all"></option><option value="yes">Disponibles</option><option data-i18n="outfits.0008.7f1b249c" value="no"></option></select></div><p class="outfitCount" id="count"></p><div class="outfitGrid" id="grid"></div></div></section></main><div aria-hidden="true" class="outfitModal" id="outfitModal"><div aria-label="Vista ampliada del outfit" aria-modal="true" class="outfitModalBox" role="dialog"><button aria-label="Cerrar" class="outfitModalClose" id="outfitModalClose" type="button">×</button><img alt="" class="outfitModalImg" id="outfitModalImg" src=""/><div class="outfitModalCaption" id="outfitModalCaption"></div></div></div><footer class="footer"><div class="shell footerRow"><div><b data-i18n="common.0043.6fbe3f50"></b><br/><span data-i18n="outfits.0009.3b860cc6"></span></div></div></footer><script src="assets/app.js"></script><script src="assets/i18n.js"></script><script>
let data=[];const G=document.getElementById('grid'),Q=document.getElementById('q'),O=document.getElementById('origin'),S=document.getElementById('status'),C=document.getElementById('count');const escOutfit=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(x,i){let v=x.variants||[];return `<article class="outfitCard" data-card="${i}"><div class="outfitVisual"><img src="${escOutfit(v[0]?.image)}" alt="${escOutfit(x.name)}"></div>${v.length>1?`<div class="outfitSwitch">${v.map((z,k)=>`<button type="button" class="${k===0?'on':''}" data-k="${k}">${escOutfit(z.label)}</button>`).join('')}</div>`:''}<h3>${escOutfit(x.name)}</h3><p class="outfitHow"><b>${x.available?'Cómo se consigue:':'Cómo se conseguía:'}</b> ${escOutfit(x.origin)}${x.price?` · ${x.price} diamantes`:''}</p>${x.note?`<p class="outfitNote">${escOutfit(x.note)}</p>`:''}<div class="outfitTags"><span class="outfitTag ${x.available?'on':'off'}">${x.available?'Disponible':'Ya no se puede conseguir'}</span><span class="outfitTag">${escOutfit(x.origin)}</span></div></article>`}
function draw(){let t=Q.value.toLowerCase().trim();let r=data.filter(x=>(!t||`${x.name} ${x.origin} ${x.note||''}`.toLowerCase().includes(t))&&(O.value==='all'||x.origin===O.value)&&(S.value==='all'||(S.value==='yes')===!!x.available));C.textContent=`${r.length} de ${data.length} outfits`;G.innerHTML=r.map((x,i)=>card(x,i)).join('');[...G.querySelectorAll('.outfitCard')].forEach((el,idx)=>{let x=r[idx],img=el.querySelector('img');el.querySelectorAll('.outfitSwitch button').forEach(b=>b.onclick=()=>{el.querySelectorAll('.outfitSwitch button').forEach(z=>z.classList.remove('on'));b.classList.add('on');img.src=x.variants[+b.dataset.k].image;img.alt=`${x.name} - ${x.variants[+b.dataset.k].label}`})})}
const M=document.getElementById('outfitModal'),MI=document.getElementById('outfitModalImg'),MC=document.getElementById('outfitModalCaption'),MX=document.getElementById('outfitModalClose');
function openOutfitModal(img,title){MI.src=img.src;MI.alt=img.alt||title;MC.textContent=img.alt||title;M.classList.add('open');M.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeOutfitModal(){M.classList.remove('open');M.setAttribute('aria-hidden','true');document.body.style.overflow='';MI.src=''}
G.addEventListener('click',e=>{const img=e.target.closest('.outfitVisual img');if(!img)return;const card=img.closest('.outfitCard');openOutfitModal(img,card?.querySelector('h3')?.textContent||'Outfit')});
MX.addEventListener('click',closeOutfitModal);M.addEventListener('click',e=>{if(e.target===M)closeOutfitModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M.classList.contains('open'))closeOutfitModal()});
[Q,O,S].forEach(e=>e.addEventListener(e===Q?'input':'change',draw));fetch('data/outfits.json').then(r=>r.json()).then(x=>{data=x;[...new Set(data.map(x=>x.origin))].sort().forEach(n=>O.insertAdjacentHTML('beforeend',`<option>${escOutfit(n)}</option>`));draw()});
</script></body></html>
