ro'};const statusLabel={pendiente:'Pendiente',revision:'En revisión',aceptada:'Aceptada',implementada:'Implementada',descartada:'Descartada'};function formatDate(v){if(!v)return 'Sin fecha';const d=new Date(v.replace(' ','T')+'Z');return isNaN(d)?v:new Intl.DateTimeFormat('es-MX',{dateStyle:'medium',timeStyle:'short'}).format(d)}function draw(){const q=search.value.trim().toLowerCase(),st=filter.value;const view=rows.filter(r=>(!st||r.estado===st)&&(!q||[r.tipo,r.pagina,r.sugerencia,String(r.id),r.estado].join(' ').toLowerCase().includes(q)));count.textContent=`${view.length} de ${rows.length} sugerencias`;list.innerHTML=view.length?view.map(r=>`<article class="suggestionAdminCard"><div class="suggestionAdminTop"><div><span class="suggestionId">#${r.id}</span><span class="suggestionType">${esc(typeLabel[r.tipo]||r.tipo)}</span><span class="suggestionStatus suggestionStatus-${esc(r.estado)}">${esc(statusLabel[r.estado]||r.estado)}</span></div><time>${esc(formatDate(r.fecha_creacion))}</time></div><h3>${esc(r.pagina||'Sugerencia general')}</h3><p class="suggestionBody">${esc(r.sugerencia)}</p></article>`).join(''):'<div class="suggestionEmpty">No hay sugerencias que coincidan con los filtros.</div>'}async function load(){notice.className='suggestionMessage';notice.textContent='';list.innerHTML='<div class="suggestionLoading">Cargando sugerencias…</div>';try{const res=await fetch('/api/sugerencias?limit=500',{headers:{Accept:'application/json'}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'No fue posible consultar las sugerencias.');rows=data.sugerencias||[];draw()}catch(e){notice.className='suggestionMessage error';notice.textContent=e.message;list.innerHTML='<div class="suggestionEmpty">No se pudieron cargar las sugerencias.</div>'}}filter.addEventListener('change',draw);search.addEventListener('input',draw);document.querySelector('#refreshSuggestions').addEventListener('click',load);load()})();</script></body></html>
